image:
  repository: rushdb/rushdb
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent

# The bootstrap token every client presents. Set `token`, or name an existing
# Secret that holds it under `existingSecretKey`. One of the two is required.
auth:
  token: ''
  existingSecret: ''
  existingSecretKey: token

# Server options. `languages` empty keeps the engine's default set
# (sql, gremlin, sql-pgq, mongodb); listing languages replaces it.
server:
  languages: []
  # Multitenant mode serves HTTP only: set pgwirePort to 0 with it.
  multitenant: false
  # Ports inside the pod. 0 turns gRPC and Bolt off; Bolt needs `cypher`.
  httpPort: 3000
  pgwirePort: 5432
  grpcPort: 0
  boltPort: 0
  # Extra `rushdb serve` flags, e.g. ['--request-timeout-ms', '30000'].
  extraArgs: []
  # Extra environment variables for the container.
  extraEnv: []

persistence:
  size: 10Gi
  storageClass: ''
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  annotations: {}

# Exposes the HTTP API only. The PostgreSQL wire, gRPC and Bolt listeners are
# plaintext; keep them on the cluster network.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: rushdb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 4Gi

# A clean stop drains requests and maintenance and writes a checkpoint.
terminationGracePeriodSeconds: 90

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
