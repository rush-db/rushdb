name: Release

on:
  push:
    tags: ["v3.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v3.x.y tag to release"
        required: true
      publish:
        description: "Publish crates after all dry runs pass"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built inside manylinux_2_28, so they run on
          # glibc 2.28+ (RHEL 8, Debian 10, Ubuntu 18.10 and later).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: aarch64-apple-darwin
          # The last Intel macOS runner image (supported until August 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: rushdb-${{ matrix.target }}.tar.gz
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: mkdir -p dist
      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/rushdb-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build (manylinux_2_28)
        if: matrix.manylinux
        run: |
          docker run --rm -v "$PWD":/src -w /src "${{ matrix.manylinux }}" bash -euc '
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            cargo build --release --locked --target ${{ matrix.target }} -p rushdb-server --bins'
          sudo chown -R "$(id -u):$(id -g)" target
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        if: ${{ !matrix.manylinux }}
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !matrix.manylinux }}
      - name: Build (macOS)
        if: ${{ !matrix.manylinux }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p rushdb-server --bins
      - name: Package
        run: |
          mkdir -p pkg out
          cp target/${{ matrix.target }}/release/rushdb README.md LICENSE pkg/
          tar -C pkg -czf "out/$ARCHIVE" rushdb README.md LICENSE
          (cd out && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")
          mv dist/rushdb-${{ matrix.target }}.spdx.json out/
          ./scripts/capture-capabilities.sh target/${{ matrix.target }}/release/rushdb out/capabilities-${{ matrix.target }}.json
      - name: Verify packaged release artifact
        run: ./scripts/verify-release-artifact.sh "out/$ARCHIVE" "out/$ARCHIVE.sha256" "out/capabilities-${{ matrix.target }}.json"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release evidence with GitHub OIDC
        run: |
          for artifact in \
            "out/$ARCHIVE" \
            "out/$ARCHIVE.sha256" \
            "out/capabilities-${{ matrix.target }}.json" \
            "out/rushdb-${{ matrix.target }}.spdx.json"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out/*

  # The one-line installer, run as users run it, on clean distributions.
  install-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            images: debian:12 ubuntu:20.04 rockylinux:8 amazonlinux:2023 alpine:3 centos:7
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            images: debian:12 rockylinux:8 alpine:3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: release
      - run: ./scripts/test-install.sh release ${{ matrix.images }}

  github-release:
    needs: [package, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # A copy of the installer as of this release, next to its archives.
      - run: cp install.sh dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          make_latest: "true"
          generate_release_notes: true
          files: dist/*

  crates-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
      - run: ./scripts/publish-crates.sh --dry-run
      - name: Publish verified library crates
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh --publish
