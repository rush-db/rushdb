name: Release 2.x images

# 2.x maintenance releases only. This branch is the Neo4j-backed 2.x line,
# supported for 12 months after the 3.0.0 release; `main` carries the 3.x Rust
# engine, which has its own release pipeline.
#
# Shipping is triggered by a push that changes package versions — see
# .github/scripts/detect-version-bumps.mjs. 2.x publishes container images only:
#   rushdb/platform    ← rushdb-core's version, rebuilt when core or dashboard bumps
#   rushdb/mcp-server  ← @rushdb/mcp-server's version, rebuilt when it bumps
#
# There is deliberately no npm publish here: npm `latest` belongs to 3.x, and a
# 2.x changesets publish would move it backwards. There is also no deploy: the
# 2.x platform deploys from its own repository, behind its deploy gate.
#
# Version bumps on this branch are manual patch/minor bumps in a PR (no
# changesets action), so an LTS fix lands exactly when it is merged.

on:
  push:
    branches:
      - 2.x
  workflow_dispatch:
    inputs:
      force_platform:
        description: 'Rebuild and publish rushdb/platform at its current version'
        type: boolean
        default: false
      force_mcp:
        description: 'Rebuild and publish rushdb/mcp-server at its current version'
        type: boolean
        default: false

permissions:
  contents: read

# Releases must not overlap; a second push waits rather than cancelling a
# half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Deploy is not part of this workflow: 2.x images are built and published here,
# and the platform repository owns deployment of the 2.x line.

jobs:
  release:
    name: Detect version bumps
    runs-on: ubuntu-latest
    outputs:
      platform_changed: ${{ steps.bumps.outputs.platform_changed }}
      platform_version: ${{ steps.bumps.outputs.platform_version }}
      mcp_changed: ${{ steps.bumps.outputs.mcp_image_changed }}
      mcp_version: ${{ steps.bumps.outputs.mcp_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect version bumps
        id: bumps
        run: node .github/scripts/detect-version-bumps.mjs
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_PLATFORM: ${{ inputs.force_platform }}
          FORCE_MCP: ${{ inputs.force_mcp }}

  platform-image:
    name: Platform image
    needs: release
    if: needs.release.outputs.platform_changed == 'true'
    uses: ./.github/workflows/docker-image.yml
    with:
      image: rushdb/platform
      slug: platform
      dockerfile: platform/Dockerfile
      version: ${{ needs.release.outputs.platform_version }}
      # Dashboard UI is served by core (RUSHDB_SERVE_STATIC=true); point its API
      # calls at the API origin so app.rushdb.com calls api.rushdb.com.
      build_args: |
        VITE_BACKEND_BASE_URL=https://api.rushdb.com
    secrets: inherit

  mcp-image:
    name: MCP image
    needs: release
    if: needs.release.outputs.mcp_changed == 'true'
    uses: ./.github/workflows/docker-image.yml
    with:
      image: rushdb/mcp-server
      slug: mcp-server
      dockerfile: packages/mcp-server/Dockerfile
      version: ${{ needs.release.outputs.mcp_version }}
    secrets: inherit

