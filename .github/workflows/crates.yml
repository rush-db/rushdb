name: Crates

# Publishes a released tag's crates to crates.io. Run it by hand after the
# GitHub release is published; it builds no release artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published v3.x.y release whose crates to publish"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A first release waits out the new-crate rate limit, about 10 minutes a crate.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # The publish scripts come from the branch this workflow runs on, so a
      # fix to them also applies to tags released before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: scripts
      - run: mv tooling "$RUNNER_TEMP/tooling"
      # A release listed in scripts/crates-io-skip.txt is not published to
      # crates.io (3.0.14, 3.0.15: their Grafeo revision is not on crates.io). The run
      # stops here and says why.
      - name: Skip releases not published to crates.io
        id: skip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          if reason=$(grep -E "^${version//./\\.}[[:space:]]" "$RUNNER_TEMP/tooling/scripts/crates-io-skip.txt"); then
            echo "::notice::$TAG is not published to crates.io: ${reason#*#}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 1.100.0
        if: steps.skip.outputs.skip != 'true'
        with:
          toolchain: 1.100.0
      - if: steps.skip.outputs.skip != 'true'
        run: $RUNNER_TEMP/tooling/scripts/check-package-sources.sh
      - if: steps.skip.outputs.skip != 'true'
        run: $RUNNER_TEMP/tooling/scripts/publish-crates.sh --dry-run
      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: $RUNNER_TEMP/tooling/scripts/publish-crates.sh --publish
