name: Crates

# Publishes a released tag's crates to crates.io. Run it by hand after the
# GitHub release is published; it builds no release artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published v3.x.y release whose crates to publish"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A first release waits out the new-crate rate limit, about 10 minutes a crate.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # The publish scripts come from the branch this workflow runs on, so a
      # fix to them also applies to tags released before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: scripts
      - run: mv tooling "$RUNNER_TEMP/tooling"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
      - run: $RUNNER_TEMP/tooling/scripts/check-package-sources.sh
      - run: $RUNNER_TEMP/tooling/scripts/publish-crates.sh --dry-run
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: $RUNNER_TEMP/tooling/scripts/publish-crates.sh --publish
