name: Publish Helm Chart

# The chart OCI repository (ghcr.io/rush-db/charts/rushdb) is shared with the
# 3.x engine chart, which the engine repository's release pipeline publishes.
# 2.x no longer publishes automatically: run this workflow manually only when a
# 2.x chart fix must ship, and never claim a 3.x chart version.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package chart
        run: helm package charts/rushdb --destination /tmp/charts

      - name: Push chart to GHCR
        run: helm push /tmp/charts/rushdb-*.tgz oci://ghcr.io/rush-db/charts

      - name: Log out
        if: always()
        run: helm registry logout ghcr.io
